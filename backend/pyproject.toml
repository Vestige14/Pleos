[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pleos-memory-link-backend"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.3",
  "pydantic==2.12.4",
  "openai==2.8.1",
  "httpx==0.28.1",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-ra"
